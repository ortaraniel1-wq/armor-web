<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faltantes entre sedes · Armor Market</title>
<style>
  :root{--am:#FFCD11;--dark:#1b1b1b;--gris:#f3f3f3;--borde:#ddd;--rojo:#c62828;--verde:#2e7d32}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--gris);color:#222}
  header{background:var(--dark);color:#fff;padding:12px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:18px}
  header h1 span{color:var(--am)}
  .act{font-size:12px;color:#bbb}
  .barra{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--borde);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
  .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{border:1px solid var(--borde);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--am);border-color:var(--am);font-weight:600}
  .chip small{opacity:.7}
  input[type=search]{flex:1;min-width:200px;padding:8px 10px;border:1px solid var(--borde);border-radius:8px;font-size:14px}
  select{padding:7px;border:1px solid var(--borde);border-radius:8px;font-size:14px}
  button{background:var(--dark);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  button.am{background:var(--am);color:#111;font-weight:600}
  main{padding:12px 16px 60px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
  th{background:#fafafa;position:sticky;top:0}
  td.num,th.num{text-align:right}
  td input[type=number]{width:70px;padding:4px;border:1px solid var(--borde);border-radius:6px;text-align:right}
  .cod{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#555}
  .sede{font-weight:600}
  .nov td{background:#ffebee}
  .ok td{background:#e8f5e9}
  .tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#eee}
  .tag.r{background:var(--rojo);color:#fff}
  .resumen{font-size:13px;color:#555}
  #carga{padding:40px;text-align:center;color:#666}
  #login{position:fixed;inset:0;z-index:50;background:var(--dark);display:flex;align-items:center;justify-content:center}
  #login form{background:#fff;border-radius:16px;padding:26px;width:300px;text-align:center}
  #login h2{margin:0 0 6px;font-size:18px}
  #login input{width:100%;font-size:22px;letter-spacing:6px;text-align:center;padding:10px;border:1px solid var(--borde);border-radius:10px;margin:12px 0}
  #login button{width:100%;padding:11px;font-size:15px}
  #login .err{color:var(--rojo);font-size:13px;min-height:18px;margin-top:8px}
  @media print{.barra,header button,.noprint{display:none!important} body{background:#fff} th{position:static}}
</style>
</head>
<body>
<div id="login"><form id="fpin">
  <h2>Faltantes <span style="color:#c9a000">entre sedes</span></h2>
  <div style="font-size:13px;color:#666">Uso interno · escribe el PIN</div>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" autofocus>
  <button class="am" type="submit">Entrar</button>
  <div class="err" id="perr"></div>
</form></div>
<header>
  <h1>Faltantes <span id="tDest">Boleíta</span> · pedido entre sedes</h1>
  <div class="act" id="act">Cargando…</div>
</header>

<div class="barra">
  <div class="fila" id="rubros"></div>
  <div class="fila">
    <select id="destino" title="Sede a la que le falta">
      <option value="BOLEITA">Sede que pide: Boleíta</option>
      <option value="CHAG">Sede que pide: Chaguaramos</option>
      <option value="GUAIRA">Sede que pide: La Guaira</option>
    </select>
    <select id="origen"></select>
    <input type="search" id="q" placeholder="Buscar descripción, código o barra…">
  </div>
  <div class="fila">
    <button class="am" onclick="exportPedido()">⬇ Pedido (Excel)</button>
    <button onclick="exportNovedades()">⬇ Novedades de inventario</button>
    <button onclick="window.print()">🖨 Imprimir</button>
    <button id="cerrar" title="Cerrar sesión en este equipo">🔒 Salir</button>
    <button onclick="limpiar()" title="Borra las cantidades físicas cargadas en este equipo">Reiniciar</button>
    <span class="resumen" id="resumen"></span>
  </div>
</div>

<main>
  <div id="carga">Leyendo el inventario de las 3 sedes…</div>
  <table id="tabla" style="display:none">
    <thead><tr>
      <th>Descripción</th><th id="thCod">Cód. Boleíta</th><th>Barra</th>
      <th>Traer de</th><th class="num">Disp. sistema</th>
      <th class="num">Pedir</th><th class="num">Físico</th><th></th>
    </tr></thead>
    <tbody id="cuerpo"></tbody>
  </table>
</main>

<script>
/* ===== CONFIGURACIÓN ===== */
const BASE = new URLSearchParams(location.search).get('base') ||
  'https://raw.githubusercontent.com/ortaraniel1-wq/armor-catalogo-datos/main/';
const SEDES = {
  BOLEITA: {archivo:'conteo_BOLEITA.json', nombre:'Boleíta'},
  CHAG:    {archivo:'conteo_CHAG.json',    nombre:'Chaguaramos'},
  GUAIRA:  {archivo:'conteo_GUAIRA.json',  nombre:'La Guaira'}
};
// Cantidad sugerida = esta fracción de lo que tiene la sede de origen (mínimo 1). Editable en pantalla.
const FRACCION_SUGERIDA = 0.5;
// Líneas de Profit agrupadas en rubros
const RUBROS = {
  BODEG:'BODEGÓN', BODEGO:'BODEGÓN',
  TECN:'TECNOLOGÍA', TECNO:'TECNOLOGÍA', APPLE:'TECNOLOGÍA', TELF:'TECNOLOGÍA', ELEC:'TECNOLOGÍA', ELECTR:'TECNOLOGÍA', GENE:'TECNOLOGÍA',
  HOGAR:'HOGAR', REFRI:'HOGAR',
  JUG:'JUGUETERÍA', JUGUET:'JUGUETERÍA', TOYS:'JUGUETERÍA', PLAY:'JUGUETERÍA',
  ACCESO:'ACCESORIOS', ACCE:'ACCESORIOS',
  CAFE:'CAFETÍN', OFIC:'OFICINA', OFICI:'OFICINA', MASCO:'MASCOTAS', PERFUM:'PERFUMERÍA'
};
/* ========================= */

let filas = [], rubroSel = '', datosAct = {};
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('falt_'+k)) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('falt_'+k, JSON.stringify(v)) }catch(e){} }
};
let ediciones = store.get('ed') || {};   // {barra:{pedir, fisico}}

function agrupar(json){
  const c = {}; json.cols.forEach((n,i)=>c[n]=i);
  const m = new Map();
  for (const r of json.items){
    const barra = String(r[c.barra]||'').trim();
    if (barra.length < 6) continue;             // descarta barras basura (IPAD, 123…)
    let g = m.get(barra);
    if (!g){ g = {barra, stock:0, codigos:[], desc:'', linea:'', mejor:-1e9}; m.set(barra,g); }
    const s = Number(r[c.stock_total])||0;
    g.stock += s;
    g.codigos.push(r[c.codigo]);
    if (s > g.mejor || !g.desc){ g.mejor = s; g.desc = String(r[c.descripcion]).trim(); g.linea = r[c.linea]; g.codigo = r[c.codigo]; }
  }
  return m;
}

let M = null;
async function cargar(){
  const jsons = await Promise.all(Object.entries(SEDES).map(async ([k,s])=>{
    const r = await fetch(BASE + s.archivo + '?t=' + Date.now());
    if (!r.ok) throw new Error('No pude leer ' + s.archivo);
    const j = await r.json(); datosAct[k] = j.actualizado; return [k, agrupar(j)];
  }));
  M = Object.fromEntries(jsons);
  document.getElementById('act').textContent =
    Object.entries(datosAct).map(([k,v])=>SEDES[k].nombre+': '+v).join(' · ');
  document.getElementById('carga').style.display='none';
  document.getElementById('tabla').style.display='';
  calcular();
}

function destino(){ return document.getElementById('destino').value }
function noCod(){ return 'NO EXISTE EN ' + SEDES[destino()].nombre.toUpperCase() }

function calcular(){
  const dest = destino();
  const otras = Object.keys(SEDES).filter(k=>k!==dest);
  // encabezados y selector de origen
  document.getElementById('tDest').textContent = SEDES[dest].nombre;
  document.getElementById('thCod').textContent = 'Cód. ' + SEDES[dest].nombre;
  const og = document.getElementById('origen'), prev = og.value;
  og.innerHTML = '<option value="">Traer de: ambas sedes</option>' +
    otras.map(k=>`<option value="${k}">Traer de: ${SEDES[k].nombre}</option>`).join('');
  if (otras.includes(prev)) og.value = prev;
  rubroSel = '';
  const D = M[dest], [k1,k2] = otras, A = M[k1], B2 = M[k2];
  const barras = new Set([...A.keys(), ...B2.keys()]);
  filas = [];
  for (const barra of barras){
    const d = D.get(barra);
    if (d && d.stock > 0) continue;               // la sede que pide sí tiene
    const a = A.get(barra), b = B2.get(barra);
    const sa = a ? a.stock : 0, sb = b ? b.stock : 0;
    if (sa <= 0 && sb <= 0) continue;              // nadie tiene
    const origen = sa >= sb ? k1 : k2;
    const o = origen === k1 ? a : b;
    const otro = origen === k1 ? sb : sa;
    if (d && ['SERV','MINER'].includes(d.linea)) continue;
    const rubro = d ? (RUBROS[d.linea] || RUBROS[o.linea] || 'OTROS') : noCod();
    filas.push({
      k: dest + '|' + barra, barra, desc: (d || o).desc, rubro,
      codB: d ? d.codigo : '—',
      origen, otraSede: origen === k1 ? k2 : k1, codO: o.codigo, disp: o.stock, otro,
      sug: Math.max(1, Math.ceil(o.stock * FRACCION_SUGERIDA))
    });
  }
  filas.sort((a,b)=>a.rubro.localeCompare(b.rubro) || a.desc.localeCompare(b.desc));
  pintarRubros(); pintar();
}

function visibles(){
  const q = document.getElementById('q').value.trim().toUpperCase();
  const og = document.getElementById('origen').value;
  return filas.filter(f =>
    (!rubroSel || f.rubro === rubroSel) &&
    (!og || f.origen === og) &&
    (!q || (f.desc+' '+f.barra+' '+f.codB+' '+f.codO).toUpperCase().includes(q)));
}

function pintarRubros(){
  const og = document.getElementById('origen').value;
  const cnt = {};
  filas.forEach(f=>{ if(!og || f.origen===og) cnt[f.rubro]=(cnt[f.rubro]||0)+1 });
  const total = Object.values(cnt).reduce((a,b)=>a+b,0);
  const NC = noCod(); const orden = Object.keys(cnt).sort((a,b)=> (a===NC)-(b===NC) || cnt[b]-cnt[a]);
  const el = document.getElementById('rubros');
  el.innerHTML = `<span class="chip ${!rubroSel?'on':''}" data-r="">Todos <small>${total}</small></span>` +
    orden.map(r=>`<span class="chip ${rubroSel===r?'on':''}" data-r="${r}">${r} <small>${cnt[r]}</small></span>`).join('');
  el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ rubroSel=ch.dataset.r; pintarRubros(); pintar(); });
}

function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])) }

function estado(f){
  const e = ediciones[f.k] || {};
  if (e.fisico === undefined || e.fisico === '') return '';
  return Number(e.fisico) < Number(f.disp) ? 'nov' : 'ok';
}

function pintar(){
  const v = visibles();
  const LIM = 600;
  document.getElementById('cuerpo').innerHTML = v.slice(0,LIM).map(f=>{
    const e = ediciones[f.k] || {};
    const st = estado(f);
    return `<tr class="${st}" data-b="${esc(f.k)}">
      <td>${esc(f.desc)} ${f.rubro===noCod()?'<span class="tag r">crear código</span>':''}</td>
      <td class="cod">${esc(f.codB)}</td>
      <td class="cod">${esc(f.barra)}</td>
      <td><span class="sede">${SEDES[f.origen].nombre}</span><br><span class="cod">cód. ${esc(f.codO)}</span>${f.otro>0?`<br><span class="tag">${SEDES[f.otraSede].nombre}: ${f.otro}</span>`:''}</td>
      <td class="num">${f.disp}</td>
      <td class="num"><input type="number" min="0" data-k="pedir" value="${e.pedir ?? f.sug}"></td>
      <td class="num"><input type="number" min="0" data-k="fisico" value="${e.fisico ?? ''}" placeholder="—"></td>
      <td>${st==='nov'?'<span class="tag r">novedad</span>':''}</td>
    </tr>`;
  }).join('') + (v.length>LIM ? `<tr><td colspan="8" style="text-align:center;color:#888">Mostrando ${LIM} de ${v.length}. Usa el buscador o elige un rubro.</td></tr>`:'');
  document.querySelectorAll('#cuerpo input').forEach(inp=>inp.onchange=()=>{
    const b = inp.closest('tr').dataset.b;
    ediciones[b] = ediciones[b] || {};
    ediciones[b][inp.dataset.k] = inp.value;
    store.set('ed', ediciones);
    const f = filas.find(x=>x.k===b);
    inp.closest('tr').className = estado(f);
    inp.closest('tr').lastElementChild.innerHTML = estado(f)==='nov'?'<span class="tag r">novedad</span>':'';
    resumen();
  });
  resumen();
}

function resumen(){
  const v = visibles();
  const nov = filas.filter(f=>estado(f)==='nov').length;
  document.getElementById('resumen').textContent =
    `${v.length} productos en vista · ${nov} novedades marcadas`;
}

function csv(nombre, cab, rows){
  const txt = '﻿' + [cab, ...rows].map(r=>r.map(x=>{
    x = String(x ?? ''); return /[;"\n]/.test(x) ? '"'+x.replace(/"/g,'""')+'"' : x;
  }).join(';')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));
  a.download = nombre; a.click();
}
function hoy(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0') }

function cargarXLSX(){
  if (window.XLSX) return Promise.resolve(true);
  return new Promise(ok=>{ const sc=document.createElement('script'); sc.src='js/xlsx.full.min.js';
    sc.onload=()=>ok(true); sc.onerror=()=>ok(false); document.head.appendChild(sc); });
}
/* Un solo Excel con una hoja por sede de origen (si no carga la librería, baja un CSV por sede) */
async function exportPedido(){
  const v = visibles();
  if (!v.length) return alertaSuave('No hay productos en esta vista.');
  const dest = SEDES[destino()].nombre;
  const cab = ['Rubro','Código origen','Barra','Descripción','Disp. sistema','Cant. pedida','Cant. física','Código '+dest];
  const grupos = {};
  v.forEach(f=>{ (grupos[f.origen] = grupos[f.origen] || []).push(f); });
  const filasDe = lst => lst.map(f=>{ const e=ediciones[f.k]||{};
    return [f.rubro,f.codO,f.barra,f.desc,f.disp,Number(e.pedir??f.sug),e.fisico===undefined||e.fisico===''?'':Number(e.fisico),f.codB]; });
  const base = `pedido_${dest.replace(/\s+/g,'_')}_${(rubroSel||'todos').replace(/\s+/g,'_')}_${hoy()}`;
  if (await cargarXLSX()){
    const wb = XLSX.utils.book_new();
    Object.entries(grupos).forEach(([k,lst])=>{
      const ori = SEDES[k].nombre;
      const aoa = [[`PEDIDO DE ${dest.toUpperCase()} A ${ori.toUpperCase()}`],
                   [`Fecha: ${hoy()}   ·   Rubro: ${rubroSel||'Todos'}   ·   Productos: ${lst.length}`],
                   [], cab, ...filasDe(lst)];
      const ws = XLSX.utils.aoa_to_sheet(aoa);
      ws['!cols'] = [{wch:14},{wch:12},{wch:15},{wch:55},{wch:10},{wch:10},{wch:10},{wch:12}];
      ws['!autofilter'] = {ref: XLSX.utils.encode_range({s:{r:3,c:0},e:{r:3+lst.length,c:cab.length-1}})};
      XLSX.utils.book_append_sheet(wb, ws, ('Desde '+ori).slice(0,31));
    });
    const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
    const el = document.createElement('a');
    el.href = URL.createObjectURL(new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    el.download = base + '.xlsx'; document.body.appendChild(el); el.click(); el.remove();
  } else {
    Object.entries(grupos).forEach(([k,lst])=>
      csv(`${base}_desde_${SEDES[k].nombre.replace(/\s+/g,'_')}.csv`, cab, filasDe(lst)));
  }
}
function exportNovedades(){
  const n = filas.filter(f=>estado(f)==='nov');
  if (!n.length) return alertaSuave('No hay novedades marcadas todavía.');
  csv(`novedades_inventario_${hoy()}.csv`,
    ['Sede','Código','Barra','Descripción','Sistema','Físico','Diferencia'],
    n.map(f=>{ const fis=Number(ediciones[f.k].fisico); return [SEDES[f.origen].nombre,f.codO,f.barra,f.desc,f.disp,fis,fis-f.disp]; }));
}
function limpiar(){
  if (!document.getElementById('resumen').dataset.c){
    document.getElementById('resumen').dataset.c='1';
    return alertaSuave('Pulsa "Reiniciar" otra vez para borrar las cantidades cargadas.');
  }
  ediciones = {}; store.set('ed', ediciones); delete document.getElementById('resumen').dataset.c; pintar();
}
function alertaSuave(t){ const r=document.getElementById('resumen'); r.textContent=t; setTimeout(resumen,3500); }

document.getElementById('q').oninput = pintar;
document.getElementById('origen').onchange = ()=>{ pintarRubros(); pintar(); };
document.getElementById('destino').onchange = ()=>{ store.set('dest', destino()); if (M) calcular(); };
{ const d0 = store.get('dest'); if (SEDES[d0]) document.getElementById('destino').value = d0; }
/* ===== PIN ===== (para cambiarlo pídele a Claude un hash nuevo) */
const PIN_HASH = '97dcf1f58f6bf9974cd53911705d7ea2c8f6f70a22e1712190e162f3b27328ce';
async function hash(t){
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('armor-faltantes:' + t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
function arrancar(){
  document.getElementById('login').remove();
  cargar().catch(e=>{ document.getElementById('carga').textContent = '⚠ ' + e.message; });
}
let okGuardado = false; try { okGuardado = localStorage.getItem('falt_ok') === PIN_HASH; } catch(e){}
if (okGuardado) arrancar();
const fpin = document.getElementById('fpin');
if (fpin) fpin.onsubmit = async e=>{
  e.preventDefault();
  const v = document.getElementById('pin').value.trim();
  if (await hash(v) === PIN_HASH){ try{ localStorage.setItem('falt_ok', PIN_HASH) }catch(e){} arrancar(); }
  else { document.getElementById('perr').textContent = 'PIN incorrecto'; document.getElementById('pin').value=''; }
};
document.getElementById('cerrar').onclick = ()=>{ try{ localStorage.removeItem('falt_ok') }catch(e){} location.reload(); };
</script>
</body>
</html>
