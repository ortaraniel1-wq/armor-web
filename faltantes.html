<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pedidos entre sedes · Armor Market</title>
<style>
  :root{--am:#FFCD11;--dark:#1b1b1b;--gris:#f3f3f3;--borde:#ddd;--rojo:#c62828;--verde:#2e7d32}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--gris);color:#222}
  header{background:var(--dark);color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  header h1{margin:0;font-size:18px} header h1 span{color:var(--am)}
  .yo{font-size:13px;color:#ddd} .yo b{color:var(--am)}
  .act{font-size:11px;color:#999;width:100%}
  nav{display:flex;gap:4px;background:var(--dark);padding:0 12px;overflow-x:auto}
  nav button{background:none;color:#bbb;border:0;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;font-size:14px;white-space:nowrap}
  nav button.on{color:#fff;border-bottom-color:var(--am);font-weight:600}
  nav .n{background:var(--am);color:#111;border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px;font-weight:700}
  .barra{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--borde);padding:10px 16px;display:flex;flex-direction:column;gap:8px}
  .fila{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chip{border:1px solid var(--borde);background:#fff;border-radius:18px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip.on{background:var(--am);border-color:var(--am);font-weight:600} .chip small{opacity:.7}
  input[type=search],input[type=text],input[type=password]{padding:8px 10px;border:1px solid var(--borde);border-radius:8px;font-size:14px}
  input[type=search]{flex:1;min-width:200px}
  select{padding:7px;border:1px solid var(--borde);border-radius:8px;font-size:14px;background:#fff}
  button{background:var(--dark);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer}
  button.am{background:var(--am);color:#111;font-weight:600}
  button.wa{background:#25D366;color:#fff;font-weight:600}
  button.gris{background:#eee;color:#333}
  button:disabled{opacity:.5;cursor:default}
  main{padding:12px 16px 60px}
  table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
  th,td{padding:7px 8px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
  th{background:#fafafa}
  td.num,th.num{text-align:right}
  .step{display:inline-flex;align-items:center;gap:4px}
  .step button{width:34px;height:34px;padding:0;font-size:20px;line-height:1;background:#eee;color:#111;border-radius:8px;font-weight:700}
  .step button:active{background:var(--am)}
  .step input[type=number]{width:52px;padding:4px;border:1px solid var(--borde);border-radius:6px;text-align:center;-moz-appearance:textfield}
  .step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  #cuerpo tr.sel td{background:#fff8d6}
  .uni{font-size:11px;color:#666;font-weight:600;margin-left:2px}
  .cod{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#555}
  .sede{font-weight:600}
  .tag{font-size:11px;border-radius:4px;padding:1px 6px;background:#eee;white-space:nowrap}
  .tag.r{background:var(--rojo);color:#fff}
  .resumen{font-size:13px;color:#555}
  .msg{padding:40px;text-align:center;color:#666}
  .card{background:#fff;border-radius:12px;margin-bottom:12px;box-shadow:0 1px 3px #0001;overflow:hidden}
  .card .cab{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:12px 14px;cursor:pointer}
  .card .pnum{font-family:ui-monospace,Consolas,monospace;font-size:16px;font-weight:700}
  .card .det{border-top:1px solid #eee;padding:10px 14px;overflow-x:auto}
  .card .det table{min-width:520px}
  .est{font-size:12px;font-weight:700;border-radius:12px;padding:2px 10px}
  .est-Enviado{background:#fff3cd;color:#7a5b00}
  .est-Cotizado{background:#e8f5e9;color:var(--verde)}
  .est-Anulado{background:#eee;color:#777}
  .acciones{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
  #login{position:fixed;inset:0;z-index:50;background:var(--dark);display:flex;align-items:center;justify-content:center;padding:16px}
  #login form{background:#fff;border-radius:16px;padding:24px;width:340px;max-width:100%;text-align:center}
  #login h2{margin:0 0 4px;font-size:19px}
  #login .sedes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:14px 0}
  #login .sedes button{background:#f2f2f2;color:#222}
  #login .sedes button.on{background:var(--am);font-weight:700}
  #login input{width:100%;margin:6px 0;font-size:16px}
  #login #pin{letter-spacing:6px;text-align:center;font-size:20px}
  #login .err{color:var(--rojo);font-size:13px;min-height:18px;margin-top:8px}
  #modal{position:fixed;inset:0;z-index:40;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}
  #modal[hidden]{display:none}
  #modal .caja{background:#fff;border-radius:16px;padding:22px;width:380px;max-width:100%;text-align:center}
  #modal .num{font-family:ui-monospace,Consolas,monospace;font-size:26px;font-weight:800;margin:6px 0 2px}
  #modal .acciones{justify-content:center} #modal .acciones button{flex:1 1 140px;padding:12px}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;display:none;max-width:90vw}
  @media (max-width:760px){
    main{padding:10px 8px 60px}
    .barra{padding:8px;position:static}
    input,select{font-size:16px!important}
    #rubros{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
    #rubros .chip{white-space:nowrap;flex:0 0 auto}
    .barra .fila:nth-child(2) select{flex:1 1 45%;min-width:0}
    .barra .fila:nth-child(2) input[type=search]{flex:1 1 100%;min-width:0}
    .barra .fila:nth-child(3){position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;padding:8px 10px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -2px 10px #0002;gap:6px}
    .barra .fila:nth-child(3) .resumen{flex:1 1 100%;order:-1;font-size:12px}
    .barra .fila:nth-child(3) button{padding:10px 12px}
    #enviar{flex:1}
    #v-pedir main{padding-bottom:130px}
    #tabla thead{display:none}
    #tabla,#tabla tbody{display:block}
    #tabla tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px;border-bottom:1px solid #e6e6e6;background:#fff}
    #tabla tr.sel{background:#fff8d6}
    #tabla td{border:0;padding:0;background:transparent!important}
    #tabla td:nth-child(1){grid-column:1/3;font-weight:600}
    #tabla td:nth-child(2),#tabla td:nth-child(3){grid-column:1;font-size:12px}
    #tabla td:nth-child(2)::before{content:'Cód. ';color:#888;font-family:system-ui}
    #tabla td:nth-child(3)::before{content:'Barra ';color:#888;font-family:system-ui}
    #tabla td:nth-child(4){grid-column:1}
    #tabla td:nth-child(5){grid-column:2;grid-row:2;text-align:right;font-size:12px;color:#555}
    #tabla td:nth-child(5)::before{content:'Disp. '}
    #tabla td:nth-child(6){grid-column:2;grid-row:3/5;align-self:center}
    .step button{width:42px;height:42px;font-size:22px}
    .step input[type=number]{padding:8px}
    .card .cab{padding:10px}
  }
</style>
</head>
<body>

<div id="login"><form id="flogin">
  <h2>Pedidos <span style="color:#c9a000">entre sedes</span></h2>
  <div style="font-size:13px;color:#666">Elige tu sede y escribe tu PIN</div>
  <div class="sedes" id="lsedes">
    <button type="button" data-s="BOLEITA">Boleíta</button>
    <button type="button" data-s="CHAG">Chaguaramos</button>
    <button type="button" data-s="GUAIRA">La Guaira</button>
    <button type="button" data-s="ADMIN">Administración</button>
  </div>
  <input type="text" id="nom" placeholder="Tu nombre" maxlength="40" autocomplete="name">
  <input type="password" id="pin" placeholder="PIN" inputmode="numeric" maxlength="8" autocomplete="off">
  <button class="am" type="submit" id="bentrar" style="width:100%;padding:11px;font-size:15px;margin-top:6px">Entrar</button>
  <div class="err" id="lerr"></div>
</form></div>

<header>
  <h1>Pedidos <span>entre sedes</span></h1>
  <div class="yo"><b id="ySede"></b> · <span id="yNom"></span> <button class="gris" id="salir" style="margin-left:8px;padding:4px 10px">Salir</button></div>
  <div class="act" id="act"></div>
</header>
<nav id="tabs">
  <button data-t="pedir" class="on">🛒 Pedir</button>
  <button data-t="pedidos">📋 Pedidos<span class="n" id="nPed" hidden></span></button>
</nav>

<section id="v-pedir">
  <div class="barra">
    <div class="fila" id="rubros"></div>
    <div class="fila">
      <select id="destino" title="Sede que pide"></select>
      <select id="origen"></select>
      <label style="font-size:13px;white-space:nowrap"><input type="checkbox" id="soloPed"> Ver solo lo que voy a pedir</label>
      <input type="search" id="q" placeholder="Buscar descripción, código o barra…">
    </div>
    <div class="fila">
      <button class="am" id="enviar">📤 Enviar pedido</button>
      <button class="gris" id="limpiar" title="Pone en 0 lo que escribiste en Pedir">Borrar cantidades</button>
      <span class="resumen" id="resumen"></span>
    </div>
  </div>
  <main>
    <div class="msg" id="carga">Leyendo el inventario de las 3 sedes…</div>
    <table id="tabla" style="display:none">
      <thead><tr><th>Descripción</th><th id="thCod">Código</th><th>Barra</th><th>Traer de</th><th class="num">Disp. sistema</th><th class="num">Pedir</th></tr></thead>
      <tbody id="cuerpo"></tbody>
    </table>
  </main>
</section>

<section id="v-pedidos" hidden><main id="pedidos"></main></section>

<div id="modal" hidden><div class="caja">
  <div style="font-size:40px">✅</div>
  <div style="font-weight:700;font-size:17px">Pedido registrado</div>
  <div class="num" id="mNum"></div>
  <div class="resumen" id="mTxt"></div>
  <p class="resumen" style="margin:14px 0 4px">Ahora mándalo al grupo de WhatsApp <b>Pedidos</b>:</p>
  <div class="acciones">
    <button class="wa" id="mWa">📲 Enviar por WhatsApp</button>
    <button id="mPdf">⬇ Descargar PDF</button>
  </div>
  <button class="gris" id="mCerrar" style="margin-top:12px;width:100%">Listo</button>
</div></div>

<div id="toast"></div>

<script src="faltantes-config.js"></script>
<script>
/* ===== CONFIGURACIÓN ===== */
const API = window.SEDES_API || '';
const BASE = new URLSearchParams(location.search).get('base') ||
  'https://raw.githubusercontent.com/ortaraniel1-wq/armor-catalogo-datos/main/';
const SEDES = {
  BOLEITA: {archivo:'conteo_BOLEITA.json', nombre:'Boleíta'},
  CHAG:    {archivo:'conteo_CHAG.json',    nombre:'Chaguaramos'},
  GUAIRA:  {archivo:'conteo_GUAIRA.json',  nombre:'La Guaira'}
};
const NOMBRE = {BOLEITA:'Boleíta', CHAG:'Chaguaramos', GUAIRA:'La Guaira', ADMIN:'Administración'};
const RUBROS = {
  BODEG:'BODEGÓN', BODEGO:'BODEGÓN',
  TECN:'TECNOLOGÍA', TECNO:'TECNOLOGÍA', APPLE:'TECNOLOGÍA', TELF:'TECNOLOGÍA', ELEC:'TECNOLOGÍA', ELECTR:'TECNOLOGÍA', GENE:'TECNOLOGÍA',
  HOGAR:'HOGAR', REFRI:'HOGAR',
  JUG:'JUGUETERÍA', JUGUET:'JUGUETERÍA', TOYS:'JUGUETERÍA', PLAY:'JUGUETERÍA',
  ACCESO:'ACCESORIOS', ACCE:'ACCESORIOS',
  CAFE:'CAFETÍN', OFIC:'OFICINA', OFICI:'OFICINA', MASCO:'MASCOTAS', PERFUM:'PERFUMERÍA'
};
/* ========================= */

const $ = s => document.querySelector(s);
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem('falt_'+k)) }catch(e){ return null } },
  set(k,v){ try{ v===null ? localStorage.removeItem('falt_'+k) : localStorage.setItem('falt_'+k, JSON.stringify(v)) }catch(e){} }
};
function esc(s){ return String(s ?? '').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])) }
function toast(t, ms=3500){ const el=$('#toast'); el.textContent=t; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none', ms); }
function sinAcento(t){ return String(t).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.-]+/g,'_') }

/* ---------- sesión y API ---------- */
let S = store.get('ses');
function api(body){
  if (!API) return Promise.reject(new Error('Falta conectar el Apps Script (faltantes-config.js).'));
  return fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(Object.assign({sede:S?.sede, pin:S?.pin, por:S?.por}, body))})
    .then(r=>r.json()).then(j=>{ if(!j.ok) throw new Error(j.error || 'Error'); return j; });
}
let selSede='';
document.querySelectorAll('#lsedes button').forEach(b=>b.onclick=()=>{
  selSede=b.dataset.s; document.querySelectorAll('#lsedes button').forEach(x=>x.classList.toggle('on', x===b)); $('#pin').focus();
});
$('#flogin').onsubmit = async e=>{
  e.preventDefault(); $('#lerr').textContent='';
  const pin=$('#pin').value.trim(), por=$('#nom').value.trim();
  if (!selSede) return $('#lerr').textContent='Elige tu sede.';
  if (!por) return $('#lerr').textContent='Escribe tu nombre.';
  if (!pin) return $('#lerr').textContent='Escribe el PIN.';
  $('#bentrar').disabled=true; $('#bentrar').textContent='Verificando…';
  S={sede:selSede, pin, por};
  try { await api({accion:'entrar'}); store.set('ses', S); return iniciar(); }
  catch(err){ S=null; $('#lerr').textContent=err.message; }
  $('#bentrar').disabled=false; $('#bentrar').textContent='Entrar';
};
$('#salir').onclick=()=>{ store.set('ses', null); location.reload(); };

/* ---------- pestañas ---------- */
let tab='pedir';
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>verTab(b.dataset.t));
function verTab(t){
  tab=t;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  document.querySelectorAll('section').forEach(s=>s.hidden = s.id!=='v-'+t);
  if (t==='pedidos') pintarPedidos();
}

/* ================= PEDIR ================= */
let M=null, filas=[], rubroSel='', datosAct={};
let ediciones = store.get('ed') || {};
function agrupar(json){
  const c={}; json.cols.forEach((n,i)=>c[n]=i);
  const m=new Map();
  for (const r of json.items){
    const barra=String(r[c.barra]||'').trim();
    if (barra.length<6) continue;
    let g=m.get(barra);
    if (!g){ g={barra, stock:0, desc:'', linea:'', mejor:-1e9}; m.set(barra,g); }
    const s=Number(r[c.stock_total])||0;
    g.stock+=s;
    if (s>g.mejor || !g.desc){ g.mejor=s; g.desc=String(r[c.descripcion]).trim(); g.linea=r[c.linea]; g.codigo=r[c.codigo]; g.unidad=String(c.unidad!==undefined?r[c.unidad]:'').trim(); }
  }
  return m;
}
async function cargarInventario(){
  const jsons=await Promise.all(Object.entries(SEDES).map(async ([k,s])=>{
    const r=await fetch(BASE+s.archivo+'?t='+Date.now());
    if (!r.ok) throw new Error('No pude leer '+s.archivo);
    const j=await r.json(); datosAct[k]=j.actualizado; return [k, agrupar(j)];
  }));
  M=Object.fromEntries(jsons);
  $('#act').textContent='Inventario: '+Object.entries(datosAct).map(([k,v])=>SEDES[k].nombre+' '+v).join(' · ');
  $('#carga').style.display='none'; $('#tabla').style.display='';
  calcular();
}
function destino(){ return $('#destino').value }
function noCod(){ return 'NO EXISTE EN '+SEDES[destino()].nombre.toUpperCase() }
function calcular(){
  const dest=destino(), otras=Object.keys(SEDES).filter(k=>k!==dest);
  $('#thCod').textContent='Cód. '+SEDES[dest].nombre;
  const og=$('#origen'), prev=og.value;
  og.innerHTML='<option value="">Traer de: ambas sedes</option>'+otras.map(k=>`<option value="${k}">Traer de: ${SEDES[k].nombre}</option>`).join('');
  if (otras.includes(prev)) og.value=prev;
  rubroSel='';
  const D=M[dest], [k1,k2]=otras, A=M[k1], B2=M[k2];
  filas=[];
  for (const barra of new Set([...A.keys(), ...B2.keys()])){
    const d=D.get(barra);
    if (d && d.stock>0) continue;
    const a=A.get(barra), b=B2.get(barra), sa=a?a.stock:0, sb=b?b.stock:0;
    if (sa<=0 && sb<=0) continue;
    const origen=sa>=sb?k1:k2, o=origen===k1?a:b;
    if (d && ['SERV','MINER'].includes(d.linea)) continue;
    filas.push({ k:dest+'|'+barra, barra, desc:(d||o).desc,
      rubro: d?(RUBROS[d.linea]||RUBROS[o.linea]||'OTROS'):noCod(),
      codB: d?d.codigo:'—', origen, otraSede:origen===k1?k2:k1, codO:o.codigo, uni:o.unidad||'', disp:o.stock, otro:origen===k1?sb:sa });
  }
  filas.sort((a,b)=>a.rubro.localeCompare(b.rubro) || a.desc.localeCompare(b.desc));
  pintarRubros(); pintar();
}
function cant(f){ return Number((ediciones[f.k]||{}).pedir||0) }
function visibles(){
  const q=$('#q').value.trim().toUpperCase(), og=$('#origen').value, solo=$('#soloPed').checked;
  return filas.filter(f=>(!rubroSel||f.rubro===rubroSel) && (!og||f.origen===og) && (!solo||cant(f)>0) &&
    (!q || (f.desc+' '+f.barra+' '+f.codB+' '+f.codO).toUpperCase().includes(q)));
}
function pintarRubros(){
  const og=$('#origen').value, cnt={};
  filas.forEach(f=>{ if(!og||f.origen===og) cnt[f.rubro]=(cnt[f.rubro]||0)+1 });
  const total=Object.values(cnt).reduce((a,b)=>a+b,0), NC=noCod();
  const orden=Object.keys(cnt).sort((a,b)=>(a===NC)-(b===NC) || cnt[b]-cnt[a]);
  $('#rubros').innerHTML=`<span class="chip ${!rubroSel?'on':''}" data-r="">Todos <small>${total}</small></span>`+
    orden.map(r=>`<span class="chip ${rubroSel===r?'on':''}" data-r="${r}">${r} <small>${cnt[r]}</small></span>`).join('');
  $('#rubros').querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ rubroSel=ch.dataset.r; pintarRubros(); pintar(); });
}
function pintar(){
  const v=visibles(), LIM=600;
  $('#cuerpo').innerHTML=v.slice(0,LIM).map(f=>`<tr data-b="${esc(f.k)}" class="${cant(f)>0?'sel':''}">
      <td>${esc(f.desc)} ${f.rubro===noCod()?'<span class="tag r">crear código</span>':''}</td>
      <td class="cod">${esc(f.codB)}</td><td class="cod">${esc(f.barra)}</td>
      <td><span class="sede">${SEDES[f.origen].nombre}</span><br><span class="cod">cód. ${esc(f.codO)}</span>${f.otro>0?`<br><span class="tag">${SEDES[f.otraSede].nombre}: ${f.otro}</span>`:''}</td>
      <td class="num">${f.disp} <span class="uni">${esc(f.uni)}</span></td>
      <td class="num"><span class="step"><button type="button" data-d="-1" aria-label="menos">−</button><input type="number" inputmode="numeric" min="0" max="${f.disp}" value="${cant(f)}"><button type="button" data-d="1" aria-label="más">+</button></span></td></tr>`).join('')+
    (v.length>LIM?`<tr><td colspan="6" style="text-align:center;color:#888">Mostrando ${LIM} de ${v.length}. Usa el buscador o elige un rubro.</td></tr>`:'');
  document.querySelectorAll('#cuerpo input').forEach(inp=>{
    inp.onchange=()=>{
      const k=inp.closest('tr').dataset.b, f=filas.find(x=>x.k===k);
      let n=Math.max(0, Math.floor(Number(inp.value)||0)); if (n>f.disp) n=f.disp; inp.value=n;
      if (n>0) ediciones[k]={pedir:n}; else delete ediciones[k];
      inp.closest('tr').classList.toggle('sel', n>0);
      store.set('ed', ediciones); resumen();
    };
    inp.onfocus=()=>{ if(inp.value==='0') inp.value=''; else inp.select(); };
    inp.addEventListener('blur',()=>{ if(inp.value==='') inp.value=0; });
  });
  document.querySelectorAll('#cuerpo .step button').forEach(b=>b.onclick=()=>{
    const inp=b.parentNode.querySelector('input'); inp.value=Math.max(0,(Number(inp.value)||0)+Number(b.dataset.d)); inp.onchange();
  });
  resumen();
}
function pedidoActual(){ return filas.filter(f=>cant(f)>0) }
function resumen(){
  const v=visibles(), ped=pedidoActual(), u=ped.reduce((s,f)=>s+cant(f),0);
  $('#resumen').textContent=`${v.length} en vista · en tu pedido: ${ped.length} productos, ${u} unidades`;
}

/* ================= DOCUMENTO PDF ================= */
function cargarJS(src){ return new Promise(ok=>{ const s=document.createElement('script'); s.src=src; s.onload=()=>ok(true); s.onerror=()=>ok(false); document.head.appendChild(s); }); }
async function libsPDF(){
  if (window.jspdf && window.jspdf.jsPDF.API.autoTable) return true;
  if (!window.jspdf) await cargarJS('js/jspdf.umd.min.js');
  await cargarJS('js/jspdf.plugin.autotable.min.js');
  return !!(window.jspdf && window.jspdf.jsPDF.API.autoTable);
}
/* Un PDF por sede de origen: cada sede recibe solo lo que se le pide */
async function crearPDF(p, origen, conCot){
  if (!(await libsPDF())) throw new Error('No pude cargar el generador de PDF');
  const {jsPDF}=window.jspdf, d=new jsPDF({unit:'mm', format:'a4'}), W=210;
  const sede=NOMBRE[p.sede]||p.sede, para=NOMBRE[origen]||origen;
  const lst=p.items.filter(i=>i.origen===origen), unidades=lst.reduce((s,i)=>s+Number(i.cantidad),0);
  const nroCot=conCot ? (mapa(p.nro_cotizacion)[origen]||'') : '';
  const asig=i=> (i.asignada===''||i.asignada==null) ? Number(i.cantidad) : Number(i.asignada);
  const uAsig=lst.reduce((s,i)=>s+asig(i),0);
  d.setFillColor(27,27,27); d.rect(0,0,W,24,'F');
  d.setTextColor(255,205,17); d.setFont('helvetica','bold'); d.setFontSize(18); d.text('ARMOR MARKET',12,15);
  d.setTextColor(255,255,255); d.setFontSize(11);
  if (nroCot){ d.text(`PEDIDO ${p.numero}`,W-12,10,{align:'right'}); d.setFontSize(16); d.text(`COTIZACIÓN ${nroCot}`,W-12,19,{align:'right'}); }
  else { d.text('PEDIDO ENTRE SEDES',W-12,11,{align:'right'}); d.setFontSize(16); d.text(p.numero,W-12,19,{align:'right'}); }
  d.setTextColor(30,30,30); d.setFontSize(10);
  const info=[['Sede que pide:',sede],['Para:',para],['Solicitado por:',p.creado_por||''],['Fecha:',p.fecha||''],['Productos:',`${lst.length}  (${unidades} unidades solicitadas)`], ...(nroCot?[['Cotización:',`${nroCot}  (${uAsig} unidades asignadas)`]]:[])];
  let y=33; info.forEach(([a,b])=>{ d.setFont('helvetica','bold'); d.text(a,12,y); d.setFont('helvetica','normal'); d.text(String(b),45,y); y+=6; });
  if (p.estado==='Anulado'){ d.setTextColor(198,40,40); d.setFont('helvetica','bold'); d.setFontSize(14); d.text('ANULADO',W-12,33,{align:'right'}); d.setTextColor(30,30,30); }
  d.autoTable({startY:y+2, margin:{left:12,right:12},
    head:[nroCot?['#',`Cód. ${para}`,'Barra','Descripción',`Cód. ${sede}`,'Unid.','Solic.','Asig.']:['#',`Cód. ${para}`,'Barra','Descripción',`Cód. ${sede}`,'Unid.','Cant.']],
    body:lst.map((i,k)=>nroCot?[k+1,i.cod_origen,i.barra,i.descripcion,i.cod_sede,i.unidad||'',i.cantidad,asig(i)]:[k+1,i.cod_origen,i.barra,i.descripcion,i.cod_sede,i.unidad||'',i.cantidad]),
    styles:{fontSize:8.5,cellPadding:1.6,valign:'middle'},
    headStyles:{fillColor:[255,205,17],textColor:20,fontStyle:'bold'},
    columnStyles: nroCot ? {0:{cellWidth:8,halign:'center'},1:{cellWidth:22},2:{cellWidth:26},4:{cellWidth:20},5:{cellWidth:13,halign:'center'},6:{cellWidth:12,halign:'center'},7:{cellWidth:12,halign:'center',fontStyle:'bold'}}
                         : {0:{cellWidth:8,halign:'center'},1:{cellWidth:24},2:{cellWidth:27},4:{cellWidth:22},5:{cellWidth:13,halign:'center'},6:{cellWidth:13,halign:'center',fontStyle:'bold'}},
    alternateRowStyles:{fillColor:[247,247,247]}});
  const n=d.getNumberOfPages();
  for (let i=1;i<=n;i++){ d.setPage(i); d.setFontSize(8); d.setTextColor(140); d.text(`${p.numero}${nroCot?' · cotización '+nroCot:''} · ${sede} a ${para} · página ${i} de ${n}`,W/2,290,{align:'center'}); }
  return d.output('blob');
}
function nombrePDF(p,o,conCot){ const c=conCot?mapa(p.nro_cotizacion)[o]:''; return `${c?'Cotizacion_'+sinAcento(c)+'_':'Pedido_'}${p.numero}_${sinAcento(NOMBRE[p.sede]||p.sede)}_para_${sinAcento(NOMBRE[o]||o)}.pdf` }
async function pdfsDe(p, conCot){
  let ors=[...new Set(p.items.map(i=>i.origen))];
  if (conCot){ const c=mapa(p.nro_cotizacion); ors=ors.filter(o=>c[o]); }
  return Promise.all(ors.map(async o=>({o, nombre:nombrePDF(p,o,conCot), blob:await crearPDF(p,o,conCot)})));
}
const esPC = !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) && matchMedia('(pointer:fine)').matches;
async function compartir(p, conCot){
  // En la computadora: baja los PDF y abre WhatsApp Web para arrastrarlos al grupo
  let ventana=null;
  if (esPC) ventana=window.open('', 'whatsapp_web');   // se abre en el clic para que el navegador no la bloquee
  try{
    const docs=await pdfsDe(p, conCot);
    if (!docs.length) throw new Error('Todavía no hay cotización');
    if (esPC){
      docs.forEach((x,i)=>setTimeout(()=>descargar(x.blob, x.nombre), i*400));
      if (ventana){ ventana.location.href='https://web.whatsapp.com/'; }
      else window.open('https://web.whatsapp.com/', 'whatsapp_web');
      toast(`${docs.length>1?docs.length+' PDF descargados':'PDF descargado'}. Arrástralo${docs.length>1?'s':''} al grupo ${conCot?'de almacén':'Pedidos'} en WhatsApp Web.`, 7000);
      return;
    }
    const files=docs.map(x=>new File([x.blob], x.nombre, {type:'application/pdf'}));
    const texto=(conCot?`Cotización ${docs.map(x=>mapa(p.nro_cotizacion)[x.o]).join(' y ')} · `:'')+`Pedido ${p.numero} · ${NOMBRE[p.sede]||p.sede} · ${p.creado_por||''} → `+docs.map(x=>NOMBRE[x.o]||x.o).join(' y ');
    if (navigator.canShare && navigator.canShare({files})){
      try{ await navigator.share({files, title:`Pedido ${p.numero}`, text:texto}); return; }
      catch(e){ if (e.name==='AbortError') return; }
    }
    docs.forEach((x,i)=>setTimeout(()=>descargar(x.blob, x.nombre), i*400));
    toast(`${docs.length>1?docs.length+' PDF descargados':'PDF descargado'}. Adjúntalo${docs.length>1?'s':''} en el grupo Pedidos de WhatsApp.`, 5000);
  }catch(e){ if (ventana) ventana.close(); toast('⚠ '+e.message, 5000); }
}
async function bajarPDF(p, conCot){

  catch(e){ toast('⚠ '+e.message, 5000); }
}
function money(n){ return '$'+(Number(n)||0).toLocaleString('es-VE',{minimumFractionDigits:2, maximumFractionDigits:2}) }
function copiar(t){
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);

/* lo que ve esta sede del pedido: la que pide y Administración ven todo; las demás, solo su parte */
function vista(p){
  if (esMia(p)) return p;
  const items=p.items.filter(i=>i.origen===S.sede);
  const cot=mapa(p.nro_cotizacion)[S.sede];
  return Object.assign({}, p, {items, estado: p.estado==='Anulado'?'Anulado':(cot?'Cotizado':'Enviado')});

function pendienteParaMi(p){

    if (!b.dataset.c){ b.dataset.c='1'; b.textContent='¿Generar con estas cantidades? toca otra vez'; return; }
    b.disabled=true;
    try{ await api({accion:'generar', numero:num, origen:o, asignadas}); pp.items.forEach(i=>delete asig[num+'|'+i.n]);
      toast('⏳ En cola: Profit la crea en menos de 1 minuto'); await refrescar(); vigilar(); }
    catch(e){ toast('⚠ '+e.message, 6000); b.disabled=false; }
  });
  document.querySelectorAll('[data-cot]').forEach(b=>b.onclick=async()=>{
    const [num,o]=b.dataset.cot.split('|'), nro=document.querySelector(`[data-nc="${b.dataset.cot}"]`).value.trim();
    if (!nro) return toast('Escribe el número de cotización de Profit.');
    const pp=vista(PED.find(x=>x.numero===num)), asignadas={};
    pp.items.filter(i=>i.origen===o).forEach(i=>asignadas[i.n]=asignada(pp,i));
    b.disabled=true; try{ await api({accion:'cotizar', numero:num, origen:o, nro_cotizacion:nro, asignadas}); pp.items.forEach(i=>delete asig[num+'|'+i.n]); toast('✅ Marcado como cotizado'); await refrescar(); }catch(e){ toast('⚠ '+e.message); b.disabled=false; }
  });
  document.querySelectorAll('[data-anular]').forEach(b=>b.onclick=async()=>{
    if (!b.dataset.c){ b.dataset.c='1'; b.textContent='¿Anular? toca otra vez'; return; }
    b.disabled=true; try{ await api({accion:'anular', numero:b.dataset.anular}); toast('Pedido anulado'); await refrescar(); }catch(e){ toast('⚠ '+e.message); b.disabled=false; }
  });
}

/* ---------- arranque ---------- */
function iniciar(){
  $('#login').remove();
  $('#ySede').textContent=NOMBRE[S.sede]; $('#yNom').textContent=S.por;
  const ds=$('#destino');
  ds.innerHTML=Object.keys(SEDES).map(k=>`<option value="${k}">Sede que pide: ${SEDES[k].nombre}</option>`).join('');
  if (S.sede==='ADMIN'){ const d0=store.get('dest'); if (SEDES[d0]) ds.value=d0; }
  else { ds.value=S.sede; ds.disabled=true; }
  libsPDF();
  cargarInventario().catch(e=>{ $('#carga').textContent='⚠ '+e.message; });
  refrescar(); setInterval(()=>{ if (!document.hidden) refrescar(); }, 60000);
}
if (!API) $('#lerr').textContent='Falta conectar el Apps Script: pega la URL /exec en faltantes-config.js';
if (S && API) iniciar();
</script>
