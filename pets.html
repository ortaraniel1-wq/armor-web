</style><style>

<style>
.top{position:sticky;top:0;z-index:20}.topin{max-width:1280px;margin:auto;display:flex;align-items:center;gap:16px}

<div class="top"><div class="topin"><a href="./"><img src="img/armor_wordmark.png" alt="Armor Market"><span class="vb"> ← Volver al catálogo</span></a><form class="ts" id="ts" role="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="tq" type="search" placeholder="Busca en Armor Pets: perrarina, arnés, cama…" autocomplete="off" enterkeyhint="search"><button type="submit">Buscar</button></form></div></div>

<script>fetch('catalogo-pets.pdf',{method:'HEAD'}).then(function(r){if(r.ok&&/pdf/.test(r.headers.get('content-type')||''))document.getElementById('pdf').hidden=false}).catch(function(){});</script>
<script>
(function(){
var URL_='https://raw.githubusercontent.com/ortaraniel1-wq/armor-catalogo-datos/main/pets.json',WA='584242580098';
var $=function(i){return document.getElementById(i)},all=[],cat='',lim=48,BASE='https://www.armorpetsve.com';
function na(t){return String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function cap(t){t=String(t).trim();return t===t.toUpperCase()?t.toLowerCase().replace(/(^|[\s(\/-])([a-záéíóúñ])/g,function(m,a,b){return a+b.toUpperCase()}):t}
function fmt(v){var e=Math.round(v*100)/100;return '$'+(e%1===0?e.toLocaleString('de-DE'):e.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}))}
var REN={'All':'Otros','Mascotas':'Otros','Calzado':'Vestimenta y Calzado','Alimentos / Dieta Barf':'Alimentos y Snacks'};
function img(r){return BASE+'/web/image/product.template/'+r.t+'/image_512'}
function card(r){var n=cap(r.n),u='https://wa.me/'+WA+'?text='+encodeURIComponent('Hola, vi en la web de Armor Pets el '+r.n+(r.c?' (Cód. '+r.c+')':'')+' a '+fmt(r.p)+' y quiero pedirlo.');
 return '<article class="card"><div class="plate"><img src="'+img(r)+'" loading="lazy" decoding="async" alt="'+esc(n)+'" onerror="this.onerror=null;this.src=\'img/pets/_foto.svg\';this.style.padding=\'25%\'"><span class="tag">'+fmt(r.p)+'</span></div>'+
 '<div class="body"><h3>'+esc(n)+'</h3><p class="disp">'+(r.s===1?'1 disponible':r.s+' disponibles')+'</p><a class="wa" href="'+u+'" target="_blank" rel="noopener">Pedir por WhatsApp</a></div></article>';}
function lista(){var q=na($('iq').value.trim()),ws=q?q.split(/\s+/):[],o=$('io').value;
 var f=all.filter(function(r){if(cat&&r.k!==cat)return false;if(!ws.length)return true;var t=na(r.n+' '+r.c+' '+r.b);return ws.every(function(w){return t.indexOf(w)>=0})});
 if(o==='pa')f.sort(function(a,b){return a.p-b.p});else if(o==='pd')f.sort(function(a,b){return b.p-a.p});else if(o==='n')f.sort(function(a,b){return a.n.localeCompare(b.n)});
 return f;}
function pintar(){var f=lista();$('ii').textContent=f.length+' productos'+(cat?' en '+cat:'');
 $('ig').innerHTML=f.length?f.slice(0,lim).map(card).join(''):'<div class="vacio">No hay productos con esa búsqueda.</div>';$('im').hidden=f.length<=lim;}
function chips(){var c={};all.forEach(function(r){c[r.k]=(c[r.k]||0)+1});var ks=Object.keys(c).sort(function(a,b){return a==='Otros'?1:b==='Otros'?-1:c[b]-c[a]});
 $('ic').innerHTML='<button data-k="" class="on">Todo</button>'+ks.map(function(k){return '<button data-k="'+esc(k)+'">'+esc(k)+' <small>'+c[k]+'</small></button>'}).join('');}
$('ic').onclick=function(e){var b=e.target.closest('button');if(!b)return;cat=b.dataset.k;lim=48;[].forEach.call($('ic').children,function(x){x.classList.toggle('on',x===b)});pintar();};
var tm;$('iq').oninput=function(){clearTimeout(tm);tm=setTimeout(function(){lim=48;pintar()},150)};$('io').onchange=function(){lim=48;pintar()};
$('im').onclick=function(){lim+=48;pintar()};
fetch(URL_+'?t='+Math.floor(Date.now()/300000),{cache:'no-store'}).then(function(r){return r.ok?r.json():null}).then(function(j){
 if(!j||!j.items){$('ii').textContent='No se pudo cargar el inventario.';return;}
 if(j.base)BASE=j.base;
 all=j.items.map(function(r){var k=REN[r[7]]||r[7]||'Otros';return {t:r[1],n:String(r[2]).trim(),c:r[3]||'',b:r[4]||'',p:+r[5],s:+r[6],k:k}}).filter(function(r){return r.p>0&&r.s>0});
 all.sort(function(a,b){return a.k.localeCompare(b.k)||a.n.localeCompare(b.n)});
 $('invn').textContent=all.length+' productos · actualizado '+j.actualizado;chips();pintar();
}).catch(function(){$('ii').textContent='No se pudo cargar el inventario.'});
})();
</script>
<script>
(function(){var f=document.getElementById('ts'),q=document.getElementById('tq'),iq=document.getElementById('iq');if(!f||!iq)return;
function go(scroll){iq.value=q.value;iq.dispatchEvent(new Event('input'));var c=document.querySelector('#ic button[data-k=""]');if(c&&!c.classList.contains('on'))c.click();
 if(scroll)document.getElementById('inventario').scrollIntoView({behavior:'smooth',block:'start'});}
var tm;q.addEventListener('input',function(){clearTimeout(tm);tm=setTimeout(function(){go(q.value.trim().length>1)},350)});
f.addEventListener('submit',function(e){e.preventDefault();go(true);q.blur();});
iq.addEventListener('input',function(){if(document.activeElement===iq)q.value=iq.value;});
var pq=new URLSearchParams(location.search).get('q');if(pq){q.value=pq;setTimeout(function(){go(true)},900);}})();
</script>
